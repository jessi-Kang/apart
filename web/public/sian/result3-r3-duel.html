<!doctype html>
<html lang="ko">
<head>
<title>결과 시안 R3 · 기록 대결</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ===== 결과 시안 R3 · 기록 대결 =====
     방향: 오늘의 나 vs 역대의 나. 누적 경쟁 축을 결과 화면의 뼈대로.
     다이얼: VARIANCE 6 / MOTION 5 / DENSITY 4 */
  :root{ --paper:#f6f6f3; --sheet:#fdfdfb; --ink:#1b1b1e; --ink-soft:#5c5c62; --line:#d9d9d3; --stamp:#c73a2f; --radius:2px; }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:light}
  body{background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans KR",system-ui,sans-serif; -webkit-font-smoothing:antialiased; word-break:keep-all;}
  button{appearance:none;-webkit-appearance:none;font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  .mono{font-family:"IBM Plex Mono",monospace}
  .frame{min-height:100dvh; display:flex; justify-content:center; padding:16px;}
  .sheet{background:var(--sheet); border:1px solid var(--line); border-radius:var(--radius); width:100%; max-width:560px; display:flex; flex-direction:column;}
  .head{display:flex; justify-content:space-between; align-items:baseline; padding:16px 20px; border-bottom:2px solid var(--ink);}
  .head b{font-size:16px;} .head b small{display:block; font-weight:400; color:var(--ink-soft); font-size:12px; margin-top:2px;}
  .head .no{font-size:12.5px; font-weight:600;}

  .body{padding:26px 20px 30px; display:flex; flex-direction:column; gap:0;}

  /* 대결 구도 */
  .duel{display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:12px; padding:10px 0 6px;}
  .side{text-align:center;}
  .side .cap{font-size:12px; color:var(--ink-soft); letter-spacing:.14em;}
  .side .num{font-size:clamp(64px,20vw,88px); font-weight:700; letter-spacing:-.05em; line-height:1.1;}
  .side.today .num{color:var(--ink);}
  .side.best .num{color:var(--ink-soft); opacity:.55;}
  .vs{font-size:13px; color:var(--stamp); font-weight:700; padding-bottom:26px; letter-spacing:.1em;}
  /* 신기록 도장 */
  .newbadge{position:absolute; top:84px; right:26px; color:var(--stamp); font-weight:700; font-size:15px; border:2.5px solid currentColor; padding:7px 12px; border-radius:3px; transform:rotate(8deg);}
  .body{position:relative;}

  .gauge{margin-top:8px; height:10px; border:1px solid var(--line); border-radius:99px; background:var(--paper); overflow:hidden;}
  .gauge i{display:block; height:100%; width:78%; background:var(--ink); border-radius:99px;}
  .gauge-note{margin-top:8px; font-size:13px; color:var(--ink-soft); text-align:center;}
  .gauge-note b{color:var(--stamp);}

  .grid{display:flex; gap:5px; justify-content:center; margin-top:22px;}
  .grid i{width:22px; height:22px; border-radius:2px; background:var(--ink);}
  .grid i.x{background:var(--sheet); border:1.6px solid var(--stamp);}

  .meta{margin-top:20px; padding-top:16px; border-top:1px dashed var(--line); display:flex; justify-content:center; gap:20px; font-size:12.5px; color:var(--ink-soft); flex-wrap:wrap;}
  .meta b{color:var(--ink);}

  .actions{margin-top:24px; display:flex; flex-direction:column; gap:10px;}
  .btn{font-size:15px; font-weight:700; padding:16px 12px; border-radius:var(--radius); text-align:center;}
  .btn-next{background:var(--ink); color:var(--sheet);}
  .btn-ghost{background:var(--sheet); color:var(--ink); border:1px solid var(--line); font-weight:500; font-size:14px; padding:13px 12px;}
  @media (min-width:768px){ .frame{align-items:center} .sheet{max-width:640px} }
  @media (prefers-reduced-motion:no-preference){
    .side .num{animation:rise .4s cubic-bezier(.22,1,.36,1) backwards;}
    .side.best .num{animation-delay:.12s}
    .newbadge{animation:slam .35s cubic-bezier(.22,1,.36,1) .4s backwards;}
    @keyframes rise{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
    @keyframes slam{from{opacity:0; transform:rotate(8deg) scale(1.7)} to{opacity:1; transform:rotate(8deg) scale(1)}}
  }
</style>
</head>
<body>
<div class="frame">
  <main class="sheet">
    <div class="head">
      <b>아파트 감별사<small>무한 감별 세션 결과</small></b>
      <span class="no mono">무한 · 09.11</span>
    </div>
    <div class="body">
      <span class="newbadge">신기록</span>
      <div class="duel">
        <div class="side today"><span class="cap mono">이번 세션</span><div class="num">12</div></div>
        <div class="vs">연속</div>
        <div class="side best"><span class="cap mono">이전 최고</span><div class="num">9</div></div>
      </div>
      <div class="gauge"><i></i></div>
      <p class="gauge-note">어제의 나를 <b>3문제</b> 차이로 이겼습니다</p>

      <div class="grid"><i></i><i></i><i></i><i class="x"></i><i></i><i></i><i></i><i></i><i class="x"></i><i></i></div>

      <p class="meta"><span>적중 <b>17/19</b></span><span>평균 <b>3.8초</b></span><span>획득 <b>+115점</b></span></p>

      <div class="actions">
        <button class="btn btn-next">세션 통지서 공유</button>
        <button class="btn btn-ghost">다시 도전</button>
      </div>
    </div>
  </main>
</div>
</body>
</html>
