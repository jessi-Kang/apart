<!doctype html>
<html lang="ko">
<head>
<title>홈 시안 3 · 공고 포스터</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============ 홈 시안 3 · 공고 포스터 ============
     방향: 관공서 게시판 공고문. 타이포 주도, 큰 여백, 괘선 없는 목록.
     다이얼: VARIANCE 8 / MOTION 4 / DENSITY 2 */
  :root{
    --paper:#f6f6f3; --sheet:#fdfdfb; --ink:#1b1b1e; --ink-soft:#5c5c62;
    --line:#d9d9d3; --stamp:#c73a2f; --stamp-soft:#f6e3e1; --radius:2px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:light}
  body{background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans KR",system-ui,sans-serif; -webkit-font-smoothing:antialiased; word-break:keep-all;}
  .mono{font-family:"IBM Plex Mono",monospace}
  a{color:inherit; text-decoration:none}

  .frame{min-height:100dvh; display:flex; justify-content:center; padding:16px;}
  .sheet{
    background:var(--sheet); border:1px solid var(--line); border-radius:var(--radius);
    width:100%; max-width:560px; box-shadow:0 1px 0 rgba(27,27,30,.04);
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* 공고 머리: 회차가 주인공 */
  .notice-head{padding:26px 22px 0; position:relative;}
  .gwan{font-size:12px; color:var(--ink-soft); letter-spacing:.14em;}
  .ep{
    font-size:clamp(58px,17vw,84px); font-weight:700; letter-spacing:-.05em; line-height:.95;
    margin-top:6px;
  }
  .ep small{font-size:.32em; font-weight:500; color:var(--ink-soft); letter-spacing:-.02em; margin-left:6px;}
  h1{margin-top:18px; font-size:clamp(21px,5.4vw,27px); line-height:1.4; letter-spacing:-.03em; max-width:17ch;}
  h1 em{font-style:normal; color:var(--stamp);}
  .status{margin-top:10px; font-size:12.5px; color:var(--ink-soft);}
  .status b{color:var(--ink);}

  /* 목록: 괘선도 칩도 없는 큰 글자 줄. 번호는 인주색 위첨자 */
  .list{margin-top:28px; padding:0 22px 8px; display:flex; flex-direction:column;}
  .item{
    display:flex; align-items:baseline; gap:12px; padding:15px 0; cursor:pointer;
    background:none; border:0; border-top:1px solid var(--line); text-align:left; width:100%;
    color:var(--ink);
  }
  .item .n{font-size:12px; color:var(--stamp); font-weight:500; min-width:20px;}
  .item .tt{font-size:clamp(20px,5.6vw,26px); font-weight:700; letter-spacing:-.03em; transition:transform .18s cubic-bezier(.22,1,.36,1); display:inline-block;}
  .item:hover .tt{transform:translateX(6px);}
  .item .dd{margin-left:auto; font-size:12px; color:var(--ink-soft); text-align:right; line-height:1.5; max-width:44%;}
  .item.off{cursor:default; opacity:.55;}
  .item.off .tt{font-weight:500; font-size:clamp(17px,4.6vw,21px);}
  .item.off:hover .tt{transform:none;}

  .foot{margin-top:auto; border-top:1px solid var(--line); padding:14px 22px; font-size:12px; color:var(--ink-soft); display:flex; flex-direction:column; gap:3px;}
  .foot a{color:var(--ink); font-weight:500;}

  @media (min-width:768px){ .frame{align-items:center;} .sheet{max-width:640px;} }
  @media (prefers-reduced-motion:no-preference){
    .item{animation:up .3s cubic-bezier(.22,1,.36,1) backwards;}
    .item:nth-child(1){animation-delay:.06s} .item:nth-child(2){animation-delay:.12s}
    .item:nth-child(3){animation-delay:.18s} .item:nth-child(4){animation-delay:.24s}
    @keyframes up{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  }
</style>
</head>
<body>
<div class="frame">
  <main class="sheet">
    <div class="notice-head">
      <div class="gwan mono">아파트 감별사 · 감별 민원 접수 창구</div>
      <div class="ep mono">#2<small>9월 11일</small></div>
      <h1>오늘 처리할 감별 민원을 <em>선택</em>하세요</h1>
      <p class="status"><b>Lv.1</b> 견습 감별사 · 다음 레벨까지 100점</p>
    </div>

    <nav class="list" aria-label="게임 목록">
      <button class="item">
        <span class="n mono">01</span>
        <span class="tt">감별 O/X</span>
        <span class="dd">오늘의 본편<br>하루 10문제 · 미접수</span>
      </button>
      <button class="item">
        <span class="n mono">02</span>
        <span class="tt">이름 조립</span>
        <span class="dd">힌트로 실존 단지명 조립</span>
      </button>
      <button class="item">
        <span class="n mono">03</span>
        <span class="tt">진짜 찾기</span>
        <span class="dd">넷 중 진짜는 하나</span>
      </button>
      <div class="item off">
        <span class="n mono">04</span>
        <span class="tt">작명소 · 우리 동네</span>
        <span class="dd">2단계 개설 예정</span>
      </div>
    </nav>

    <div class="foot">
      <span>단지 정보 출처: 공공데이터포털 K-apt</span>
      <span>© 2026 <a href="#">Jessi</a> · <a href="#">개발 일지</a> · <a href="#">앱 설치</a></span>
    </div>
  </main>
</div>
</body>
</html>
