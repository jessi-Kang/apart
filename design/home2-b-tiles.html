<!doctype html>
<html lang="ko">
<head>
<title>홈 시안 2 · 창구 타일</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============ 홈 시안 2 · 창구 타일 ============
     방향: 은행 창구 표지판 같은 종이 타일 벤토. 큰 번호, 비대칭 리듬.
     다이얼: VARIANCE 7 / MOTION 5 / DENSITY 4 */
  :root{
    --paper:#f6f6f3; --sheet:#fdfdfb; --ink:#1b1b1e; --ink-soft:#5c5c62;
    --line:#d9d9d3; --stamp:#c73a2f; --stamp-soft:#f6e3e1; --radius:2px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:light}
  body{background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans KR",system-ui,sans-serif; -webkit-font-smoothing:antialiased; word-break:keep-all;}
  .mono{font-family:"IBM Plex Mono",monospace}
  a{color:inherit; text-decoration:none}

  .frame{min-height:100dvh; display:flex; justify-content:center; padding:16px;}
  .sheet{
    background:var(--sheet); border:1px solid var(--line); border-radius:var(--radius);
    width:100%; max-width:560px; box-shadow:0 1px 0 rgba(27,27,30,.04);
    display:flex; flex-direction:column;
  }
  header{display:flex; justify-content:space-between; align-items:baseline; padding:18px 20px; border-bottom:2px solid var(--ink);}
  .brand{font-weight:700; font-size:16px; letter-spacing:-.02em;}
  .brand small{display:block; font-weight:400; color:var(--ink-soft); font-size:12px; margin-top:2px;}
  .issue{font-size:12px; color:var(--ink-soft); text-align:right; line-height:1.5;}

  .body{padding:26px 20px 30px;}
  h1{font-size:clamp(25px,6.2vw,34px); line-height:1.28; letter-spacing:-.03em; max-width:12ch;}
  h1 em{font-style:normal; color:var(--stamp);}
  .sub{margin-top:10px; color:var(--ink-soft); font-size:14px; line-height:1.65;}
  .status{margin-top:12px; font-size:12.5px; color:var(--ink-soft);}
  .status b{color:var(--ink);}

  /* 창구 타일: 2열 벤토, 마지막 타일은 가로로 눕는다 */
  .tiles{margin-top:22px; display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .tile{
    position:relative; background:var(--sheet); border:1px solid var(--ink); border-radius:var(--radius);
    padding:16px 14px 14px; min-height:128px; display:flex; flex-direction:column; text-align:left;
    cursor:pointer; transition:transform .15s cubic-bezier(.22,1,.36,1), box-shadow .15s ease;
  }
  .tile:hover{transform:translateY(-2px); box-shadow:0 3px 0 rgba(27,27,30,.1);}
  .tile:active{transform:translateY(0);}
  .tile .big-no{
    font-size:34px; font-weight:500; line-height:1; color:var(--ink); letter-spacing:-.02em;
  }
  .tile .tt{display:block; font-weight:700; font-size:15.5px; letter-spacing:-.02em; margin-top:auto; padding-top:18px;}
  .tile .dd{display:block; font-size:12px; color:var(--ink-soft); margin-top:4px; line-height:1.5;}
  .tile .badge{
    position:absolute; top:12px; right:12px; font-size:10.5px; font-weight:700; color:var(--stamp);
    border:1.5px solid currentColor; border-radius:var(--radius); padding:2px 6px; transform:rotate(3deg);
  }
  .tile.wide{grid-column:1 / -1; min-height:0; flex-direction:row; align-items:center; gap:14px;}
  .tile.wide .tt{margin-top:0; padding-top:0;}
  .tile.wide .big-no{font-size:26px;}
  .tile.off{border:1.5px dashed var(--line); cursor:default; color:var(--ink-soft); background:none;}
  .tile.off:hover{transform:none; box-shadow:none;}
  .tile.off .big-no{color:var(--ink-soft); opacity:.6;}
  .tile.off .tt{font-weight:500; color:var(--ink-soft);}

  .foot{margin-top:auto; border-top:1px solid var(--line); padding:14px 20px; font-size:12px; color:var(--ink-soft); display:flex; flex-direction:column; gap:3px;}
  .foot a{color:var(--ink); font-weight:500;}

  @media (max-width:379px){ .tiles{grid-template-columns:1fr;} .tile{min-height:0;} }
  @media (min-width:768px){ .frame{align-items:center;} .sheet{max-width:660px;} }
  @media (prefers-reduced-motion:no-preference){
    .tile{animation:place .32s cubic-bezier(.22,1,.36,1) backwards;}
    .tile:nth-child(1){animation-delay:.04s} .tile:nth-child(2){animation-delay:.1s}
    .tile:nth-child(3){animation-delay:.16s} .tile:nth-child(4){animation-delay:.22s}
    @keyframes place{from{opacity:0; transform:translateY(10px) rotate(.3deg)} to{opacity:1; transform:none}}
  }
</style>
</head>
<body>
<div class="frame">
  <main class="sheet">
    <header>
      <div class="brand">아파트 감별사<small>감별 민원 접수 창구</small></div>
      <div class="issue mono">#2<br>09.11</div>
    </header>

    <div class="body">
      <h1>오늘 처리할 감별 민원을 <em>선택</em>하세요</h1>
      <p class="sub">진짜 아파트와 AI가 지은 이름을 가려내는 데일리 게임</p>
      <p class="status"><b>Lv.1</b> 견습 감별사 · 다음 레벨까지 100점</p>

      <nav class="tiles" aria-label="게임 목록">
        <button class="tile">
          <span class="big-no mono">1</span>
          <span class="badge">오늘의 본편</span>
          <span class="tt">감별 O/X</span>
          <span class="dd">하루 10문제 · 오늘 미접수</span>
        </button>
        <button class="tile">
          <span class="big-no mono">2</span>
          <span class="tt">이름 조립</span>
          <span class="dd">힌트로 실존 단지명 조립</span>
        </button>
        <button class="tile wide">
          <span class="big-no mono">3</span>
          <span>
            <span class="tt">진짜 찾기</span>
            <span class="dd">넷 중 진짜는 하나 · 콤보 도전</span>
          </span>
        </button>
        <div class="tile wide off">
          <span class="big-no mono">4</span>
          <span>
            <span class="tt">작명소 · 우리 동네</span>
            <span class="dd">2단계 개설 예정 창구</span>
          </span>
        </div>
      </nav>
    </div>

    <div class="foot">
      <span>단지 정보 출처: 공공데이터포털 K-apt</span>
      <span>© 2026 <a href="#">Jessi</a> · <a href="#">개발 일지</a> · <a href="#">앱 설치</a></span>
    </div>
  </main>
</div>
</body>
</html>
