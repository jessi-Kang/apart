<!doctype html>
<html lang="ko">
<head>
<title>홈 시안 1 · 접수 대장</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============ 홈 시안 1 · 접수 대장 ============
     방향: 홈을 진짜 민원 서식처럼. 문서번호 칸, 괘선 그리드, 현황 도장.
     다이얼: VARIANCE 4 / MOTION 3 / DENSITY 6 */
  :root{
    --paper:#f6f6f3; --sheet:#fdfdfb; --ink:#1b1b1e; --ink-soft:#5c5c62;
    --line:#d9d9d3; --stamp:#c73a2f; --stamp-soft:#f6e3e1; --radius:2px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:light}
  body{background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans KR",system-ui,sans-serif; -webkit-font-smoothing:antialiased; word-break:keep-all;}
  button{
    appearance:none; -webkit-appearance:none; -webkit-tap-highlight-color:transparent;
    font:inherit; color:inherit; background:none; border:none; padding:0; text-align:left;
  }
  .mono{font-family:"IBM Plex Mono",monospace}
  a{color:inherit; text-decoration:none}

  .frame{min-height:100dvh; display:flex; justify-content:center; padding:16px;}
  .sheet{
    background:var(--sheet); border:1px solid var(--line); border-radius:var(--radius);
    width:100%; max-width:560px; box-shadow:0 1px 0 rgba(27,27,30,.04);
    display:flex; flex-direction:column;
  }

  /* 서식 머리: 문서번호 칸이 있는 표두 */
  .form-head{display:grid; grid-template-columns:1fr auto; border-bottom:2px solid var(--ink);}
  .form-title{padding:18px 20px;}
  .form-title b{font-size:17px; letter-spacing:-.02em;}
  .form-title small{display:block; color:var(--ink-soft); font-size:12px; margin-top:2px; font-weight:400;}
  .form-no{
    border-left:1px solid var(--line); display:grid; grid-template-rows:1fr 1fr; min-width:96px; text-align:center;
  }
  .form-no > span{padding:6px 14px; font-size:12px; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; gap:6px;}
  .form-no > span + span{border-top:1px solid var(--line);}
  .form-no b{color:var(--ink); font-weight:500;}

  .body{padding:26px 20px 30px;}
  h1{font-size:clamp(25px,6.2vw,34px); line-height:1.28; letter-spacing:-.03em;}
  h1 em{font-style:normal; color:var(--stamp);}
  .sub{margin-top:10px; color:var(--ink-soft); font-size:14px; line-height:1.65;}
  .status{margin-top:14px; font-size:12.5px; color:var(--ink-soft);}
  .status b{color:var(--ink);}

  /* 접수 대장 표: 순번 / 창구 / 현황 */
  .ledger{margin-top:22px; border:1px solid var(--ink); border-radius:var(--radius); overflow:hidden;}
  .ledger-head{
    display:grid; grid-template-columns:52px 1fr 88px; background:var(--paper);
    border-bottom:1px solid var(--ink); font-size:11.5px; color:var(--ink-soft);
  }
  .ledger-head span{padding:8px 10px; text-align:center;}
  .ledger-head span:nth-child(2){text-align:left; border-inline:1px solid var(--line);}
  .row{
    display:grid; grid-template-columns:52px 1fr 88px; align-items:stretch;
    border:none; border-bottom:1px solid var(--line); cursor:pointer; background:none;
    width:100%; text-align:left; font:inherit; color:inherit; padding:0;
  }
  .row:last-child{border-bottom:none;}
  .row:hover{background:var(--paper);}
  .row .no{
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:500;
    border-right:1px solid var(--line); color:var(--ink);
  }
  .row .cell{padding:14px 12px;}
  .row .tt{display:block; font-weight:700; font-size:15.5px; letter-spacing:-.02em;}
  .row .dd{display:block; font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.5;}
  .row .st{
    display:flex; align-items:center; justify-content:center; border-left:1px solid var(--line);
  }
  /* 현황 도장: 접수중 / 완료 / 미개설 */
  .chop{
    font-size:11px; font-weight:700; color:var(--stamp); border:1.6px solid currentColor;
    border-radius:var(--radius); padding:4px 8px; transform:rotate(-4deg); letter-spacing:.02em;
  }
  .chop.done{color:var(--ink);}
  .chop.off{color:var(--ink-soft); border-style:dashed; transform:none; font-weight:500;}
  .row.off{cursor:default; color:var(--ink-soft);}
  .row.off .tt{color:var(--ink-soft); font-weight:500;}
  .row.off:hover{background:none;}

  .foot{
    margin-top:auto; border-top:1px solid var(--line); padding:14px 20px;
    font-size:12px; color:var(--ink-soft); display:flex; flex-direction:column; gap:3px;
  }
  .foot a{color:var(--ink); font-weight:500;}

  @media (min-width:768px){ .frame{align-items:center;} .sheet{max-width:640px;} }
  @media (prefers-reduced-motion:no-preference){
    .ledger .row{animation:drop .3s cubic-bezier(.22,1,.36,1) backwards;}
    .ledger .row:nth-child(2){animation-delay:.05s}
    .ledger .row:nth-child(3){animation-delay:.1s}
    .ledger .row:nth-child(4){animation-delay:.15s}
    .ledger .row:nth-child(5){animation-delay:.2s}
    @keyframes drop{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  }
</style>
</head>
<body>
<div class="frame">
  <main class="sheet">
    <div class="form-head">
      <div class="form-title">
        <b>아파트 감별사</b>
        <small>감별 민원 접수 창구</small>
      </div>
      <div class="form-no mono">
        <span><b>제2호</b></span>
        <span><b>09.11</b></span>
      </div>
    </div>

    <div class="body">
      <h1>오늘 처리할<br>감별 민원을 <em>선택</em>하세요</h1>
      <p class="sub">진짜 아파트와 AI가 지은 이름을 가려내는 데일리 게임</p>
      <p class="status"><b>Lv.1</b> 견습 감별사 · 다음 레벨까지 100점</p>

      <div class="ledger" role="list">
        <div class="ledger-head mono"><span>순번</span><span>창구</span><span>현황</span></div>
        <button class="row" role="listitem">
          <span class="no mono">1</span>
          <span class="cell"><span class="tt">감별 O/X</span><span class="dd">오늘의 본편 · 하루 10문제</span></span>
          <span class="st"><span class="chop">접수중</span></span>
        </button>
        <button class="row" role="listitem">
          <span class="no mono">2</span>
          <span class="cell"><span class="tt">이름 조립</span><span class="dd">힌트로 실존 단지명 조립 · 매일 10문제</span></span>
          <span class="st"><span class="chop">접수중</span></span>
        </button>
        <button class="row" role="listitem">
          <span class="no mono">3</span>
          <span class="cell"><span class="tt">진짜 찾기</span><span class="dd">넷 중 진짜는 하나 · 매일 10라운드</span></span>
          <span class="st"><span class="chop">접수중</span></span>
        </button>
        <div class="row off" role="listitem">
          <span class="no mono">4</span>
          <span class="cell"><span class="tt">작명소 · 우리 동네</span><span class="dd">2단계 개설 예정 창구</span></span>
          <span class="st"><span class="chop off">미개설</span></span>
        </div>
      </div>
    </div>

    <div class="foot">
      <span>단지 정보 출처: 공공데이터포털 K-apt</span>
      <span>© 2026 <a href="#">Jessi</a> · <a href="#">개발 일지</a> · <a href="#">앱 설치</a></span>
    </div>
  </main>
</div>
</body>
</html>
