<title>아파트 감별사 시안 B</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ============ 시안 B · 야간 전광판 ============
     콘셉트: 밤의 분양 전광판. 어두운 도시 위에 뜨는 단지명 한 줄.
     팔레트: 잉크 다크(zinc-950 계열) + 일렉트릭 그린(단일 액센트)
     radius: all-soft(14px) / 폰트: IBM Plex Sans KR + Mono */
  :root{
    --bg:#101013; --panel:#17171b; --panel-2:#1d1d22;
    --tx:#ececee; --tx-soft:#9c9ca4; --line:#2a2a31;
    --green:#3ddc84; --green-dim:rgba(61,220,132,.12);
    --red:#ff6b5e; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:dark}
  body{
    background:var(--bg); color:var(--tx);
    font-family:"IBM Plex Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"IBM Plex Mono",monospace}
  [hidden]{display:none!important}
  ::selection{background:var(--green); color:#0c2416;}
  :focus-visible{outline:2px solid var(--green); outline-offset:3px; border-radius:4px;}

  .app{min-height:100dvh; display:flex; flex-direction:column; padding:20px 16px; max-width:520px; margin:0 auto;}

  header{display:flex; justify-content:space-between; align-items:center; padding-bottom:16px;}
  .brand{font-weight:700; font-size:15px; letter-spacing:-.01em;}
  .brand b{color:var(--green); font-weight:700;}
  .streak{
    font-size:12px; color:var(--tx-soft);
    background:var(--panel); border:1px solid var(--line); border-radius:99px; padding:6px 12px;
  }
  .streak b{color:var(--green); font-weight:600;}

  .screen{flex:1; display:flex; flex-direction:column;}

  /* ---- 인트로 ---- */
  .intro{justify-content:center;}
  .intro h1{font-size:clamp(30px,8vw,42px); font-weight:700; letter-spacing:-.03em; line-height:1.25; word-break:keep-all;}
  .intro p{margin-top:14px; color:var(--tx-soft); font-size:15px; line-height:1.7; max-width:32ch;}
  .yesterday{
    margin-top:26px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px 18px; font-size:13.5px; line-height:1.6;
  }
  .yesterday b{color:var(--green); font-weight:600;}
  .yesterday span{color:var(--tx-soft); display:block; margin-top:2px;}
  .go{margin-top:26px;}

  /* ---- 문제 ---- */
  .hud{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--tx-soft);}
  .bar{height:4px; background:var(--panel-2); border-radius:99px; margin-top:10px; overflow:hidden;}
  .bar i{display:block; height:100%; width:100%; background:var(--green); border-radius:99px; transition:transform .3s ease; transform:scaleX(0); transform-origin:left;}
  .board{
    flex:1; display:flex; align-items:center; justify-content:center;
    margin:18px 0; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:32px 20px; min-height:220px;
    background-image:radial-gradient(ellipse at 50% 0%, rgba(61,220,132,.05), transparent 60%);
  }
  .qname{
    font-size:clamp(28px,8vw,40px); font-weight:700; letter-spacing:-.03em;
    line-height:1.3; text-align:center; word-break:keep-all; max-width:13ch;
  }

  /* ---- 판정 ---- */
  .verdict{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:14px;
  }
  .verdict .mark{font-size:13px; font-weight:600;}
  .verdict.right .mark{color:var(--green);}
  .verdict.wrong .mark{color:var(--red);}
  .verdict h3{margin-top:8px; font-size:16.5px; letter-spacing:-.01em;}
  .verdict .meta{margin-top:8px; color:var(--tx-soft); font-size:13px; line-height:1.7;}
  .verdict .rate{margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:12.5px; color:var(--tx-soft);}
  .verdict .rate b{color:var(--tx); font-weight:600;}

  /* ---- 버튼 ---- */
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .btn{
    font-family:inherit; font-size:17px; font-weight:700; padding:18px 12px;
    border-radius:var(--radius); cursor:pointer; letter-spacing:-.01em;
    transition:transform .12s ease, filter .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.98);}
  .btn-real{background:var(--green); color:#0c2416; border:none;}
  .btn-fake{background:var(--panel-2); color:var(--tx); border:1px solid var(--line);}
  .btn-next{width:100%; background:var(--tx); color:var(--bg); border:none; font-size:15px; padding:16px;}
  .btn-ghost{background:transparent; color:var(--tx-soft); border:1px solid var(--line); font-size:14px; padding:14px;}

  /* ---- 결과 ---- */
  .result{padding-top:8px;}
  .r-head{font-size:13px; color:var(--tx-soft);}
  .r-score{font-size:clamp(52px,15vw,80px); font-weight:700; letter-spacing:-.04em; line-height:1; margin-top:8px;}
  .r-score small{font-size:.4em; color:var(--tx-soft); font-weight:500;}
  .r-grade{
    display:inline-block; margin-top:16px; background:var(--green-dim); color:var(--green);
    border:1px solid rgba(61,220,132,.35); border-radius:99px; padding:10px 18px;
    font-weight:700; font-size:clamp(15px,4.5vw,19px); word-break:keep-all;
  }
  .r-desc{margin-top:14px; color:var(--tx-soft); font-size:14px; line-height:1.7; max-width:32ch;}
  .r-grid{margin-top:20px; font-size:21px; letter-spacing:2px;}
  .review{margin-top:22px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:6px 18px;}
  .review li{list-style:none; display:flex; justify-content:space-between; gap:12px; padding:12px 0; font-size:13.5px;}
  .review li + li{border-top:1px solid var(--line);}
  .review .nm{font-weight:500;}
  .review .nm.x{color:var(--tx-soft);}
  .review .tag{font-size:12px; color:var(--tx-soft); white-space:nowrap;}
  .review .tag.f{color:var(--red);}
  .r-actions{margin-top:auto; padding-top:24px; display:grid; gap:10px;}

  footer{padding-top:18px; font-size:11.5px; color:var(--tx-soft); display:flex; justify-content:space-between;}

  .side{display:none;}

  /* ============ 타블렛 ≥768 ============ */
  @media (min-width:768px){
    .app{max-width:600px; padding:36px 24px;}
    .board{min-height:280px;}
    .choices{gap:14px;}
  }

  /* ============ 데스크탑 ≥1024 : 50/50 스플릿 ============ */
  @media (min-width:1024px){
    body{overflow-y:auto;}
    .layout{display:grid; grid-template-columns:1fr 1fr; min-height:100dvh; max-width:1440px; margin:0 auto;}
    .side{
      display:flex; flex-direction:column; justify-content:space-between;
      padding:56px; border-right:1px solid var(--line);
      background:radial-gradient(ellipse at 20% 90%, rgba(61,220,132,.06), transparent 55%);
    }
    .side h2{font-size:48px; font-weight:700; letter-spacing:-.035em; line-height:1.2; word-break:keep-all;}
    .side h2 b{color:var(--green); font-weight:700;}
    .side .stat{display:flex; gap:40px; border-top:1px solid var(--line); padding-top:24px;}
    .side .stat div p:first-child{font-size:26px; font-weight:700;}
    .side .stat div p:last-child{font-size:12.5px; color:var(--tx-soft); margin-top:4px;}
    .app{max-width:none; padding:56px 64px; margin:0;}
    .qname{font-size:38px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important; animation:none!important;}
  }
</style>

<div class="layout">
  <aside class="side">
    <h2>오늘 밤도<br>이름 하나가<br><b>수상합니다</b></h2>
    <div class="stat">
      <div><p class="mono">#37</p><p>9월 10일 회차</p></div>
      <div><p class="mono">54%</p><p>어제 전국 평균</p></div>
      <div><p class="mono">10</p><p>오늘의 문제</p></div>
    </div>
  </aside>

  <div class="app">
    <header>
      <div class="brand">아파트 <b>감별사</b></div>
      <div class="streak">🔥 <b>6일</b> 연속 감별 중</div>
    </header>

    <!-- 인트로 -->
    <section class="screen intro" id="s-intro">
      <h1>진짜 아파트만<br>골라내면 됩니다</h1>
      <p>실존 단지명이면 진짜, AI가 지어낸 이름이면 가짜. 하루 10문제, 전국이 같은 문제를 풉니다.</p>
      <div class="yesterday">
        어제 3번 문제, 전국 <b>23%</b>만 맞혔습니다
        <span>뭐였는지는 오늘 문제 끝나고 공개</span>
      </div>
      <div class="go"><button class="btn btn-next" onclick="start()">오늘 문제 시작</button></div>
    </section>

    <!-- 문제 -->
    <section class="screen" id="s-quiz" hidden>
      <div class="hud mono"><span id="qnum">01 / 10</span><span id="score-hud">감별 진행 중</span></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="board"><h2 class="qname" id="qname"></h2></div>

      <div class="verdict" id="verdict" hidden>
        <span class="mark" id="v-mark"></span>
        <h3 id="v-title"></h3>
        <p class="meta" id="v-meta"></p>
        <p class="rate" id="v-rate"></p>
      </div>

      <div class="choices" id="choices">
        <button class="btn btn-real" onclick="answer(true)">진짜</button>
        <button class="btn btn-fake" onclick="answer(false)">가짜</button>
      </div>
      <div class="choices" id="nextwrap" hidden>
        <button class="btn btn-next" style="grid-column:1/-1" onclick="next()" id="nextbtn">다음</button>
      </div>
      <footer><span>출처: 공공데이터포털 K-apt</span><span class="mono">RESET 00:00</span></footer>
    </section>

    <!-- 결과 -->
    <section class="screen result" id="s-result" hidden>
      <p class="r-head">오늘의 감별 성적</p>
      <p class="r-score" id="r-score"></p>
      <span class="r-grade" id="r-grade"></span>
      <p class="r-desc" id="r-desc"></p>
      <p class="r-grid" id="r-grid"></p>
      <ul class="review" id="r-review"></ul>
      <div class="r-actions">
        <button class="btn btn-next" onclick="share()" id="sharebtn">결과 복사해서 자랑하기</button>
        <button class="btn btn-ghost" onclick="location.reload()">처음부터 다시 보기</button>
      </div>
    </section>
  </div>
</div>

<script>
const Q=[
 {n:"헬리오시티",real:true,meta:"서울 송파구 가락동<br>2018년 준공 · 9,510세대",rate:88},
 {n:"e편한세상 더 프라임 노블",real:false,hint:"실존 브랜드에 없는 조합을 붙였습니다",rate:61},
 {n:"래미안 원베일리",real:true,meta:"서울 서초구 반포동<br>2023년 준공 · 2,990세대",rate:74},
 {n:"힐스테이트 리버센트럴 에듀포레",real:false,hint:"펫네임이 하나 더 얹혔습니다",rate:47},
 {n:"트리마제",real:true,meta:"서울 성동구 성수동<br>2017년 준공 · 688세대",rate:69},
 {n:"아이파크 센트럴 에듀리버",real:false,hint:"입지 키워드 두 개를 이어 붙였습니다",rate:52},
 {n:"경희궁 자이",real:true,meta:"서울 종로구 홍파동<br>2017년 준공 · 2,415세대",rate:71},
 {n:"푸르지오 레이크시티 그랑포레",real:false,hint:"있을 법하지만 없는 호수입니다",rate:38},
 {n:"디에이치 아너힐즈",real:true,meta:"서울 강남구 개포동<br>2019년 준공 · 1,320세대",rate:33},
 {n:"롯데캐슬 스카이 퍼스티지",real:false,hint:"하늘과 명예를 동시에 약속했습니다",rate:29},
];
let i=0, marks=[];
const $=id=>document.getElementById(id);

function start(){ $("s-intro").hidden=true; $("s-quiz").hidden=false; render(); }
function render(){
  const q=Q[i];
  $("qname").textContent=q.n;
  $("qnum").textContent=String(i+1).padStart(2,"0")+" / 10";
  $("bar").style.transform=`scaleX(${i/Q.length})`;
  $("verdict").hidden=true; $("choices").hidden=false; $("nextwrap").hidden=true;
}
function answer(saidReal){
  const q=Q[i], ok=saidReal===q.real;
  marks.push(ok);
  $("bar").style.transform=`scaleX(${(i+1)/Q.length})`;
  const v=$("verdict");
  v.hidden=false; v.className="verdict "+(ok?"right":"wrong");
  $("v-mark").textContent=ok?"● 정답":"● 오답";
  $("v-title").textContent=q.real?"진짜 있는 아파트입니다":"AI가 지은 이름입니다";
  $("v-meta").innerHTML=q.real?q.meta:q.hint;
  $("v-rate").innerHTML=`이 문제, 지금까지 <b>${q.rate}%</b>가 맞혔습니다`;
  $("choices").hidden=true; $("nextwrap").hidden=false;
  $("nextbtn").textContent=(i===Q.length-1)?"감별 등급 확인":"다음";
}
function next(){ i++; if(i<Q.length){render();} else{finish();} }

const GRADES=[
 {min:0,name:"외지인 🧳",desc:"아파트 이름이 다 그게 그거 같죠? 정상입니다. 내일 다시 오세요."},
 {min:4,name:"전세 유목민 🏃",desc:"발품은 팔아봤는데, 이름까진 안 외웠군요. 감은 있습니다."},
 {min:7,name:"부동산 카페 눈팅러 👀",desc:"매일 눈팅한 짬은 못 속입니다. 상위권 감별력."},
 {min:9,name:"시어머니도 못 찾는 이름 감별사 🏆",desc:"이름만 봐도 평면도가 보이는 수준. 최고 등급입니다."},
];
function finish(){
  const s=marks.filter(Boolean).length;
  const g=[...GRADES].reverse().find(g=>s>=g.min);
  $("s-quiz").hidden=true; $("s-result").hidden=false;
  $("r-score").innerHTML=s+"<small> / 10</small>";
  $("r-grade").textContent=g.name;
  $("r-desc").textContent=g.desc;
  $("r-grid").textContent=marks.map(m=>m?"🟩":"⬛").join("");
  $("r-review").innerHTML=Q.map((q,k)=>
    `<li><span class="nm ${marks[k]?'':'x'}">${q.n}</span><span class="tag ${q.real?'':'f'}">${q.real?"진짜":"가짜"}</span></li>`
  ).join("");
}
function share(){
  const s=marks.filter(Boolean).length;
  const g=[...GRADES].reverse().find(g=>s>=g.min);
  const t=`아파트 감별사 #37 🏢\n${marks.map(m=>m?"🟩":"⬛").join("")} ${s}/10\n${g.name}\napt-gam.kr`;
  navigator.clipboard?.writeText(t).then(()=>{ $("sharebtn").textContent="복사 완료. 붙여넣기만 하면 됩니다"; });
}
</script>
