# 주간 점검: 진짜·가짜 비율
#
# 왜 있나: 감별은 진짜:가짜가 반반이어야 "모르면 반은 맞는" 게임이다. 그런데 풀은
# 매일 밤 늘고(실단지 수집·가짜 생성·작명 출제) 구역마다 가짜가 따로 갈린다. 반반이
# 깨져도 화면에서는 안 보인다 — 겉모양으로 찍을 수 있던 상태로 세 주를 돈 적이 있다.
# 그래서 일주일에 한 번 실제로 나간 문제·출제 규칙·구역별 풀·겉모양을 재서 일지
# 이슈에 남긴다(scripts/weekly-balance.mts).
#
# 리포트는 reports/weekly/날짜.md로 레포에 쌓는다. 이슈 댓글은 알림이라 흘러가고,
# 몇 주 치를 나란히 놓고 보려면 파일로 남아 있어야 한다. web/ 밖이라 배포는 돌지 않는다.
# DB에는 지난 점검의 합계 한 줄만 쓴다(balance_snapshot — 누적에서 이번 주 몫만 빼 보려고).
#
# 필요한 시크릿: DATABASE_URL (없으면 실제 출제분만 건너뛰고 나머지는 잰다)
name: weekly-balance

on:
  schedule:
    # 월요일 08:47 KST (일요일 23:47 UTC). 정각은 몰려서 늦게 돈다
    - cron: "47 23 * * 0"
  workflow_dispatch:

# 야간 작업과 같은 묶음이라 동시에 밀지 않는다
concurrency:
  group: data-push
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4
        with:
          ref: claude/apartment-quiz-game-planning-i6rqe9

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 출제 규칙을 실제 코드(lib/*.ts)로 돌리고 DB 드라이버를 쓰느라 설치한다. 주 1회라 부담이 적다
      - name: 의존성 설치
        working-directory: web
        run: npm ci

      - name: 비율 재기
        working-directory: web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run weekly-balance

      - name: 리포트 쌓기
        run: |
          d=$(TZ=Asia/Seoul date +%F)
          mkdir -p reports/weekly
          cp /tmp/balance.md "reports/weekly/$d.md"
          git config user.name "apt-gam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "reports/weekly/$d.md"
          if git diff --cached --quiet; then
            echo "::notice::같은 날 리포트와 내용이 같아 커밋하지 않습니다."
            exit 0
          fi
          head=$(head -1 "reports/weekly/$d.md" | sed 's/^### //')
          git commit -m "chore: 주간 점검 리포트 $d (자동)" \
            -m "$head" \
            -m "세 창구(감별·찾기·조립)의 진짜·가짜 비율과 겉모양 힌트를 재서 reports/weekly에 쌓는다. 이슈 댓글은 흘러가서 몇 주 치를 견주려면 파일로 남아 있어야 한다." \
            -m ".github/workflows/weekly-balance.yml"
          git pull --rebase -q origin claude/apartment-quiz-game-planning-i6rqe9
          git push

      - name: 결과 알리기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/report-nightly.sh "주간 점검"
